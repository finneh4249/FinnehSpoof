# GeminiSpoofer core configuration

# Optional: enable/disable bot responses globally
enabled: true

# Debug chat flow logging (throttled)
debug_chat: false

# Require at least one human online for bot chat
require_human_for_chat: false

# Optional: number of recent chat lines to use as context
context_lines: 15

# ═══════════════════════════════════════════════════════════════════════════════
# TAB COMPLETION INJECTION
# ═══════════════════════════════════════════════════════════════════════════════
tab-completion:
  inject-fakes: true
  exclude-commands:
    - "op"
    - "deop"
    - "ban"
    - "kick"
    - "pardon"
    - "ban-ip"
    - "pardon-ip"

# Fake tab display format (TAB/list). Supports %player_name% and %ping%
fake_tab_display_format: "%player_name% &7Ping: &a%ping%"
fake_ping_min: 85
fake_ping_max: 260

# ═══════════════════════════════════════════════════════════════════════════════
# SERVER LIST SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════
server-list:
  enabled: true
  add-to-online-count: true

# ═══════════════════════════════════════════════════════════════════════════════
# Timezone-aware activity scaling (Aus/NZ default)
# ═══════════════════════════════════════════════════════════════════════════════
timezone: "Australia/Sydney"
peak_start_hour: 18
peak_end_hour: 23
offpeak_start_hour: 2
offpeak_end_hour: 7
peak_multiplier: 1.0
normal_multiplier: 0.6
offpeak_multiplier: 0.2