# GeminiSpoofer configuration
# Provide your Google Gemini API key below.
api_key: ""
gemini_api_key: ""

# LLM provider selection: gemini | openai | openrouter | anthropic
llm_provider: "gemini"

# Gemini model selection (e.g., gemini-2.0-flash-exp, gemini-1.5-flash, gemini-flash-lite-latest)
gemini_model: "gemini-2.0-flash-exp"

# OpenAI settings
openai_api_key: ""
openai_model: "gpt-4o-mini"

# OpenRouter settings
openrouter_api_key: ""
openrouter_model: "openai/gpt-4o-mini"
openrouter_referer: ""
openrouter_title: "FinnehSpoof"

# Anthropic settings
anthropic_api_key: ""
anthropic_model: "claude-3-5-haiku-20241022"
anthropic_max_tokens: 200

# Optional: enable/disable bot responses globally
enabled: true

# Debug chat flow logging (throttled)
debug_chat: false

# Require at least one human online for bot chat
require_human_for_chat: false

# Optional: number of recent chat lines to use as context
context_lines: 15

# ═══════════════════════════════════════════════════════════════════════════════
# CONVERSATION SEEDER - Prevents dead air and topic loops
# ═══════════════════════════════════════════════════════════════════════════════
conversation-seeder:
  enabled: true
  # How long before seeder fires (seconds)
  idle-threshold-seconds: 300
  # Chance of seeder firing per tick when idle
  seed-chance: 0.3
  # Topic summarization
  summarize-every-messages: 50
  summarize-every-minutes: 30
  summary-context-lines: 50
  max-exhausted-topics: 10
  # Heat boost after seed
  seed-heat-boost: 0.4

# ═══════════════════════════════════════════════════════════════════════════════
# FLUCTUATION SYSTEM - Dynamic bot join/leave behavior
# ═══════════════════════════════════════════════════════════════════════════════
fluctuation:
  enabled: true
  # How often to reset join counters (seconds)
  check-interval: 600
  # Minimum seconds between bot joins
  join-cooldown-seconds: 20
  # Minimum human players needed for fluctuation to run
  min-players-online: 0
  # Minimum bots to keep online
  min-online: 2
  # Maximum bots allowed online
  max-online: 15
  # Maximum joins per check interval
  max-players-per-check: 5
  # Startup batch spawning
  startup:
    enabled: true
    batch-size: 4
    batch-delay: 40
    batch-delay-variation: 20

# Maximum number of bots active at once
max_active_bots: 4

# Target total players (humans + bots). Bots fill the gap with randomness.
target_total_players: 50
bot_fill_random_range: 3

# Empty server population
empty_server_min_bots: 1
empty_server_max_bots: 3

# Join/leave behavior (chance evaluated every 5 seconds)
join_chance: 0.30
leave_chance: 0.04
join_catchup: 0.12
leave_catchup: 0.10

# Stagger bot joins (ticks, 20 ticks = 1 second)
join_stagger_min_ticks: 10
join_stagger_max_ticks: 40

# Leave grace periods (seconds)
leave_grace_after_join_seconds: 30
leave_grace_after_chat_seconds: 60

# Spawn control
spawn_min_distance: 20
spawn_max_distance: 60
spawn_attempts: 12

# Terrain safety (max height change allowed around target)
cliff_max_drop: 3

# Session length bounds (seconds)
min_session_seconds: 420
max_session_seconds: 1500

# Minimum cooldown after a bot leaves before it can rejoin (seconds)
session_cooldown_seconds: 120

# Random walking behavior
walk_radius: 10
walk_interval_seconds: 10

# Chat ebb/flow tuning
chat_base_chance: 0.15
chat_max_chance: 0.75
chat_heat_decay: 0.08
chat_heat_human_increase: 0.45
chat_heat_bot_decrease: 0.08

# When no humans are online, scale chat chance by this multiplier
chat_dead_server_multiplier: 0.05

# Bot response cooldown to avoid pile-ons (seconds)
bot_response_cooldown_seconds: 30

# Chat typing delays (in ticks, 20 ticks = 1 second)
chat_typing_base_delay: 40        # Initial delay before message appears (2 seconds)
chat_typing_ticks_per_char: 4     # Ticks per character (~5 chars/sec typing speed)
chat_typing_variation: 20         # Random variation in ticks (+/- 1 second)

# Join greetings
greeting:
  enabled: true
  human-join-chance: 0.05
  bot-join-chance: 0.01
  delay-min-ticks: 200
  delay-max-ticks: 600
  affects-heat: false

# ═══════════════════════════════════════════════════════════════════════════════
# TRIGGER SYSTEM - Control when bots respond to chat
# ═══════════════════════════════════════════════════════════════════════════════
trigger:
  # Mode: 'all' = respond to any message, 'mention' = only when bot is mentioned, 'keyword' = only when keywords match
  mode: all
  # Keywords that trigger responses (only used if mode is 'keyword' or 'all')
  keywords:
    - "anyone"
    - "someone"
    - "everybody"
    - "guys"
    - "yall"
    - "y'all"
  # Messages containing these words will never trigger a response
  blacklist-words:
    - "spam"
    - "hack"
    - "cheat"
    - "exploit"

# Deep thinking - extra boost when a human just spoke
deep-thinking:
  enabled: true
  # Consider a human "recent" for this many seconds
  recent-human-seconds: 30
  context-boost: |
    A REAL HUMAN is talking to you. Think about what they actually want.
    - If they ask a question, answer it directly and briefly
    - If they're chatting, chat back naturally
    - Match their energy
    - Keep it SHORT (2-10 words)
    - Sound like a real player, not a bot

# Typo simulation
typo-simulation:
  enabled: true
  chance: 0.08
  t-prefix-chance: 0.01
  replacements:
    "the": ["teh", "th"]
    "you": ["u", "yo"]
    "your": ["ur", "yor"]
    "what": ["wut", "wat"]
    "that": ["tht", "dat"]
    "don't": ["dont", "dnt"]
    "can't": ["cant"]
    "because": ["cuz", "bc"]
    "probably": ["prolly", "prob"]
    "something": ["smth"]
    "someone": ["sm1"]
    "really": ["rly", "rlly"]
    "people": ["ppl"]
    "about": ["abt", "bout"]
    "though": ["tho"]
    "through": ["thru"]
    "going": ["goin", "gonna"]

# Repetition control
repetition:
  max-history: 5
  penalty-chance: 0.5
  min-word-length: 4

# Join/leave message templates
bot_join_message: "&8[&a+&8] &f%player_name%"
bot_leave_message: "&8[&c-&8] &f%player_name%"

# Bot chat format fallback (used if QuickChat formatting is unavailable)
bot_chat_format: "<%player_name%> %message%"

# ═══════════════════════════════════════════════════════════════════════════════
# TAB COMPLETION INJECTION
# ═══════════════════════════════════════════════════════════════════════════════
tab-completion:
  inject-fakes: true
  exclude-commands:
    - "op"
    - "deop"
    - "ban"
    - "kick"
    - "pardon"
    - "ban-ip"
    - "pardon-ip"

# Fake tab display format (TAB/list). Supports %player_name% and %ping%
fake_tab_display_format: "%player_name% &7Ping: &a%ping%"
fake_ping_min: 85
fake_ping_max: 260

# ═══════════════════════════════════════════════════════════════════════════════
# SERVER LIST SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════
server-list:
  enabled: true
  add-to-online-count: true

# Timezone-aware activity scaling (Aus/NZ default)
timezone: "Australia/Sydney"
peak_start_hour: 18
peak_end_hour: 23
offpeak_start_hour: 2
offpeak_end_hour: 7
peak_multiplier: 1.0
normal_multiplier: 0.6
offpeak_multiplier: 0.2